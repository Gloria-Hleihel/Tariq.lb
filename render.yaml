services:
  - type: web
    name: tariq-lb
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi:application db upgrade && gunicorn "wsgi:application" --config gunicorn.conf.py
    healthCheckPath: /healthz
    disk:
      name: tariq-lb-uploads
      mountPath: /var/data/tariq-lb/uploads
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: tariq-lb-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: MODEL_PATH
        value: models/road_damage_v3.pt
      - key: DETECTION_MODEL_PATH
        value: models/road_damage_v3.pt
      - key: DETECTION_API_URL
        value: internal
      - key: DETECTION_API_TOKEN
        sync: false
      - key: DETECTION_API_REQUIRE_TOKEN
        value: "true"
      - key: DETECTION_PRELOAD_MODEL
        value: "true"
      - key: AUTO_CREATE_DATABASE
        value: "false"
      - key: UPLOAD_FOLDER
        value: /var/data/tariq-lb/uploads
      - key: ANNOTATED_FOLDER
        value: /var/data/tariq-lb/uploads/annotated
      - key: PERSISTENT_UPLOADS_CONFIRMED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"

databases:
  - name: tariq-lb-db
    region: frankfurt
    plan: starter
    databaseName: tariq_lb
    user: tariq_lb
