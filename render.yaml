services:
  - type: web
    name: tariq-lb
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "wsgi:application" --config gunicorn.conf.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: AUTO_CREATE_DATABASE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: tariq-lb-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: tariq.lb@admin2026
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: MODEL_PATH
        value: models/road_damage_v3.pt
      - key: DETECTION_API_URL
        value: internal
      - key: DETECTION_PRELOAD_MODEL
        value: "0"
      - key: PERSISTENT_UPLOADS_CONFIRMED
        value: "false"
      - key: ALLOW_EPHEMERAL_UPLOADS
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: tariq-lb-db
    plan: free
    databaseName: tariq_lb
    user: tariq_lb
