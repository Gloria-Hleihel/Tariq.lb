<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }} - Tariq.lb</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reference-theme.css') }}">
</head>
<body class="reference-theme landing-page">
  <main class="hero-section" style="min-height:100vh;">
    <section class="hero-shell" aria-labelledby="error-title">
      <div class="hero-copy-block">
        <p class="hero-pill">
          <span aria-hidden="true"></span>
          Tariq.lb
        </p>
        <h1 id="error-title">
          <span>{{ status_code }}</span>
          <span class="headline-green">{{ title }}</span>
        </h1>
        <p class="hero-subtitle">{{ message }}</p>
        <div class="hero-actions" aria-label="Error page actions">
          <a class="primary-cta" href="{{ url_for('reports.index') }}">Go Home</a>
          <a class="secondary-cta" href="{{ url_for('reports.map_page') }}">View Live Map</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
